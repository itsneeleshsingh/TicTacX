<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicTacX</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header">
            <h1>TicTac<span>X</span></h1>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="game">
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
            </div>
        </div>
        <div class="optionsBar">
            <button id="resetBtn">Reset Game</button>
        </div>
        <div class="menu">
            <h1 class="winnerTxt">Congratulations player wins!</h1>
            <button id="restartBtn">Restart Game</button>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
